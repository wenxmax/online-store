name: Qoder Auto Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  qoder-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Qoder Code Review
        uses: wenxinax/qoder-action@chore/bump-qodercli-version
        env:
          GOTRACEBACK: "system"
        with:
          qoder_personal_access_token: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
          prompt: |
            /review-pr
            REPO:${{ github.repository }} PR_NUMBER:${{ github.event.pull_request.number }}
            OUTPUT_LANGUAGE:English

      - name: Print Qoder Debug Log
        if: always()
        run: |
          echo "Displaying logs from: $HOME/.qoder/logs/qodercli.log"
          if [ -f "$HOME/.qoder/logs/qodercli.log" ]; then
            cat "$HOME/.qoder/logs/qodercli.log"
          else
            echo "Log file not found at expected path."
          fi
      - name: Debug Info
        if: always()
        run: |
          uname -a
          ldd --version
          ldd $(which qodercli)
